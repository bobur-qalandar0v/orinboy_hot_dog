<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O'rinboy Admin</title>
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fff1c2;
        --card: #fffdf6;
        --ink: #3a1c0d;
        --mute: #85685a;
        --red: #d62f1f;
        --mustard: #f2b705;
        --green: #2f7d4f;
        --blue: #2b6cb0;
        --sh: #3a1c0d;
        --line: #e3c97a;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1f130c;
          --card: #34211a;
          --ink: #fff1d6;
          --mute: #c4a88e;
          --sh: #0d0704;
          --line: #5a3a2b;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1f130c;
        --card: #34211a;
        --ink: #fff1d6;
        --mute: #c4a88e;
        --sh: #0d0704;
        --line: #5a3a2b;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          500 15px/1.45 "Bricolage Grotesque",
          system-ui,
          sans-serif;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .shell {
        min-height: 100vh;
      }
      aside {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 250px;
        z-index: 40;
        background: var(--card);
        border-right: 3px solid var(--ink);
        display: flex;
        flex-direction: column;
        padding: 14px 12px;
        transform: translateX(-102%);
        transition: transform 0.3s cubic-bezier(0.3, 0.9, 0.3, 1);
        overflow-y: auto;
      }
      body.side-open aside {
        transform: none;
      }
      .content {
        min-width: 0;
        transition: margin-left 0.3s cubic-bezier(0.3, 0.9, 0.3, 1);
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 35;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      @media (min-width: 900px) {
        body.side-open .content {
          margin-left: 250px;
        }
        .scrim {
          display: none;
        }
      }
      @media (max-width: 899px) {
        body.side-open .scrim {
          opacity: 1;
          pointer-events: auto;
        }
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        padding: 6px 8px 14px;
        color: var(--red);
      }
      .brand small {
        color: var(--mute);
        font-size: 12px;
        font-weight: 700;
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      nav button {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        border: 2px solid transparent;
        background: none;
        color: var(--ink);
        border-radius: 12px;
        padding: 11px 12px;
        font-weight: 700;
        cursor: pointer;
      }
      nav button i {
        font-style: normal;
        font-size: 19px;
        width: 24px;
        text-align: center;
      }
      nav button:hover {
        background: color-mix(in srgb, var(--mustard) 22%, transparent);
      }
      nav button.on {
        background: var(--mustard);
        color: #3a1c0d;
        border-color: var(--ink);
        box-shadow: 3px 3px 0 var(--sh);
      }
      nav .badge {
        margin-left: auto;
      }
      .sidefoot {
        margin-top: auto;
        padding-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 2px dashed var(--line);
      }
      .theme {
        display: flex;
        border: 2px solid var(--ink);
        border-radius: 12px;
        overflow: hidden;
      }
      .theme button {
        flex: 1;
        border: 0;
        background: none;
        padding: 8px 0;
        font-size: 17px;
        cursor: pointer;
      }
      .theme button.on {
        background: var(--mustard);
      }
      .lo {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 2px solid var(--ink);
        background: var(--card);
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 800;
        cursor: pointer;
        color: var(--red);
      }
      .lo i {
        font-style: normal;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        background: var(--red);
        color: #fff;
        border-bottom: 3px solid var(--ink);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      header h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .pill {
        margin-left: auto;
        background: var(--card);
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 99px;
        padding: 4px 12px;
        font-weight: 800;
        font-size: 14px;
      }
      #burger {
        border: 2px solid var(--ink);
        background: var(--card);
        color: var(--ink);
        border-radius: 10px;
        width: 42px;
        height: 42px;
        font-size: 20px;
        cursor: pointer;
      }
      #login {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      #login .box {
        width: min(380px, 100%);
      }
      #login h1 {
        margin: 0 0 4px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #login label {
        display: block;
        font-weight: 700;
        margin: 14px 0 6px;
      }
      #login input {
        width: 100%;
        padding: 12px;
        border: 2px solid var(--ink);
        border-radius: 12px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
      }
      .lerr {
        color: var(--red);
        font-weight: 700;
        min-height: 22px;
        margin: 8px 0 0;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn[aria-busy="true"] {
        opacity: 0.8;
        cursor: wait;
      }
      .spin {
        display: inline-block;
        width: 1em;
        height: 1em;
        margin-right: 8px;
        vertical-align: -0.15em;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .btn {
        width: 100%;
        margin-top: 10px;
        background: var(--mustard);
        color: #3a1c0d;
        border: 2px solid var(--ink);
        border-radius: 12px;
        font-weight: 800;
        font-size: 16px;
        padding: 12px;
        cursor: pointer;
        box-shadow: 3px 3px 0 var(--sh);
      }
      .badge {
        background: var(--red);
        color: #fff;
        border-radius: 99px;
        padding: 0 7px;
        margin-left: 6px;
        font-size: 12px;
      }
      main {
        max-width: 1150px;
        margin: 0 auto;
        padding: 20px;
      }
      .grid {
        display: grid;
        gap: 14px;
      }
      .cards {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        margin-bottom: 14px;
      }
      .two {
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        margin-bottom: 14px;
      }
      .card {
        background: var(--card);
        border: 2px solid var(--ink);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 4px 4px 0 var(--sh);
      }
      .card h3 {
        margin: 0 0 12px;
        font-size: 17px;
        font-weight: 800;
      }
      .stat .l {
        color: var(--mute);
        font-weight: 700;
        font-size: 13px;
      }
      .stat .v {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .stat .s {
        color: var(--mute);
        font-size: 13px;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 150px;
      }
      .bars .c {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        height: 100%;
        min-width: 0;
      }
      .bar {
        width: 100%;
        background: var(--red);
        border: 2px solid var(--ink);
        border-radius: 6px 6px 0 0;
        min-height: 2px;
        transform-origin: bottom;
        animation: grow 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) both;
      }
      .bar.m {
        background: var(--mustard);
      }
      @keyframes grow {
        from {
          transform: scaleY(0);
        }
      }
      .lbl {
        font-size: 10px;
        color: var(--mute);
        margin-top: 4px;
        white-space: nowrap;
      }
      .hb {
        display: grid;
        grid-template-columns: minmax(110px, 1.3fr) 3fr auto;
        gap: 10px;
        align-items: center;
        margin-bottom: 9px;
        font-size: 14px;
      }
      .hb .n {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
      }
      .hb .t {
        height: 16px;
        background: color-mix(in srgb, var(--mustard) 25%, transparent);
        border-radius: 99px;
        overflow: hidden;
        border: 2px solid var(--ink);
      }
      .hb .t i {
        display: block;
        height: 100%;
        background: var(--red);
        animation: wid 0.8s ease both;
      }
      @keyframes wid {
        from {
          width: 0 !important;
        }
      }
      .split {
        display: flex;
        height: 26px;
        border: 2px solid var(--ink);
        border-radius: 99px;
        overflow: hidden;
        margin: 6px 0 10px;
      }
      .split i {
        display: block;
        height: 100%;
      }
      .tablewrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
      }
      th,
      td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 2px dashed var(--line);
      }
      th {
        font-size: 13px;
        color: var(--mute);
      }
      input[type="search"] {
        width: 100%;
        max-width: 340px;
        padding: 10px 14px;
        border: 2px solid var(--ink);
        border-radius: 12px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        margin-bottom: 12px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .chips button {
        border: 2px solid var(--ink);
        background: var(--card);
        border-radius: 99px;
        padding: 6px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .chips button.on {
        background: var(--mustard);
        color: #3a1c0d;
      }
      .order {
        margin-bottom: 14px;
      }
      .oh {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        margin-bottom: 8px;
      }
      .oh b {
        font-size: 18px;
      }
      .tag {
        display: inline-block;
        border: 2px solid var(--ink);
        border-radius: 99px;
        padding: 1px 10px;
        font-size: 12px;
        font-weight: 800;
        background: var(--card);
      }
      .s-new {
        background: var(--mustard);
        color: #3a1c0d;
      }
      .s-cooking {
        background: #f6a35c;
        color: #3a1c0d;
      }
      .s-delivering {
        background: #8cc4f2;
        color: #3a1c0d;
      }
      .s-done {
        background: #8fd3a5;
        color: #3a1c0d;
      }
      .s-cancelled {
        background: #e6a29b;
        color: #3a1c0d;
      }
      .s-completed {
        background: #c9b8f0;
        color: #3a1c0d;
      }
      .oi {
        margin: 6px 0 10px;
        padding-left: 18px;
      }
      .act {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .act button {
        border: 2px solid var(--ink);
        background: var(--card);
        border-radius: 10px;
        padding: 6px 12px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 2px 2px 0 var(--sh);
      }
      .act button:active {
        transform: translate(1px, 1px);
        box-shadow: 1px 1px 0 var(--sh);
      }
      .act button[disabled] {
        opacity: 0.4;
        cursor: default;
      }
      .muted {
        color: var(--mute);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 120px);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 12px;
        font-weight: 700;
        transition: transform 0.35s cubic-bezier(0.2, 1.3, 0.4, 1);
        z-index: 9;
      }
      #toast.show {
        transform: translate(-50%, 0);
      }
      .mrow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 10px 0;
        border-bottom: 2px dashed var(--line);
      }
      .mrow:last-child {
        border-bottom: 0;
      }
      .mrow .mn {
        flex: 1;
        min-width: 200px;
      }
      .mrow .mp {
        font-weight: 800;
      }
      .mrow.sold .mn {
        opacity: 0.5;
        text-decoration: line-through;
      }
      dialog {
        border: 2px solid var(--ink);
        border-radius: 16px;
        background: var(--card);
        color: var(--ink);
        padding: 20px;
        width: min(420px, 92vw);
        box-shadow: 5px 5px 0 var(--sh);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      dialog h3 {
        margin: 0 0 6px;
      }
      dialog label {
        display: block;
        font-weight: 700;
        margin-top: 12px;
      }
      dialog input,
      dialog textarea {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid var(--ink);
        border-radius: 10px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        margin-top: 4px;
      }
      .th {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
        border: 2px solid var(--ink);
        vertical-align: middle;
        margin-right: 8px;
      }
      .rnd2 {
        border-top: 2px dashed var(--line);
        padding-top: 10px;
        margin-top: 10px;
      }
      .tchip small {
        color: var(--mute);
        font-weight: 700;
        font-size: 12px;
      }
      .tg {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tchip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 2px solid var(--ink);
        border-radius: 12px;
        padding: 6px 12px;
        font-weight: 800;
        background: var(--card);
      }
      .tchip.busy {
        background: #e6a29b;
        color: #3a1c0d;
      }
      .tchip button {
        border: 0;
        background: none;
        color: var(--red);
        font-size: 18px;
        font-weight: 800;
        cursor: pointer;
        padding: 0 0 0 4px;
      }
      .pw {
        font-family: monospace;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .eye {
        border: 0;
        background: none;
        cursor: pointer;
        font-size: 17px;
        padding: 0 4px;
      }
      [hidden] {
        display: none !important;
      }
    button[aria-busy="true"]{opacity:.75;cursor:wait}
</style>
  </head>
  <body>
    <div class="shell">
      <aside id="side" aria-label="Asosiy menyu">
        <div class="brand">🌭 <span>O'rinboy</span><small>Admin</small></div>
        <nav id="nav">
          <button data-t="dash" class="on">
            <i>📊</i><span>Statistika</span>
          </button>
          <button data-t="all">
            <i>📋</i><span>Barcha buyurtmalar</span>
          </button>
          <button data-t="orders">
            <i>🧾</i><span>Bot buyurtmalari</span
            ><span class="badge" id="newb" hidden>0</span>
          </button>
          <button data-t="users"><i>👥</i><span>Mijozlar</span></button>
          <button data-t="menu"><i>🍔</i><span>Menyu</span></button>
          <button data-t="zones">
            <i>🛵</i><span>Yetkazish hududlari</span>
          </button>
          <button data-t="zal">
            <i>🍽️</i><span>Zal</span
            ><span class="badge" id="zalb" hidden>0</span>
          </button>
          <button data-t="couriers">
            <i>🚗</i><span>Dastavchiklar</span
            ><span class="badge" id="cb" hidden>0</span>
          </button>
          <button data-t="shop"><i>⏰</i><span>Ish vaqti</span></button>
        </nav>
        <div class="sidefoot">
          <div class="theme" id="theme" role="group" aria-label="Mavzu">
            <button
              data-th="light"
              title="Yorug' mavzu"
              aria-label="Yorug' mavzu"
            >
              ☀️
            </button>
            <button
              data-th="auto"
              title="Qurilma sozlamasi bo'yicha"
              aria-label="Avtomatik mavzu"
            >
              🖥️
            </button>
            <button
              data-th="dark"
              title="Qorong'u mavzu"
              aria-label="Qorong'u mavzu"
            >
              🌙
            </button>
          </div>
          <button class="lo" id="logout"><i>🚪</i><span>Chiqish</span></button>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>
      <div class="content">
        <header>
          <button
            id="burger"
            aria-label="Menyuni ochish yoki yopish"
            aria-expanded="false"
          >
            ☰
          </button>
          <h1 id="ptitle">Statistika</h1>
          <span class="pill" id="shopchip"></span>
        </header>
        <main>
          <section id="dash"></section>
          <section id="all" hidden></section>
          <section id="orders" hidden></section>
          <section id="users" hidden></section>
          <section id="menu" hidden></section>
          <section id="zones" hidden></section>
          <section id="zal" hidden></section>
          <section id="couriers" hidden></section>
          <section id="shop" hidden></section>
        </main>
      </div>
    </div>
    <div id="login" hidden>
      <form class="card box" id="lf">
        <h1>🌭 O'rinboy Admin</h1>
        <p class="muted" style="margin: 0">
          Davom etish uchun parolni kiriting
        </p>
        <label for="lp">Parol</label
        ><input
          id="lp"
          type="password"
          autocomplete="current-password"
          required
        />
        <p class="lerr" id="lerr" role="alert"></p>
        <button class="btn" type="submit">Kirish</button>
      </form>
    </div>
    <div id="toast" role="status"></div>
    <dialog id="dlg">
      <form id="mf">
        <h3 id="dt">Yangi mahsulot</h3>
        <label>Bo'lim<input id="fc" list="dc" required maxlength="40" /></label
        ><datalist id="dc"></datalist>
        <label>Nomi<input id="fn" required maxlength="80" /></label>
        <label>Tavsif (ixtiyoriy)<input id="fd" maxlength="120" /></label>
        <label
          >Narxi (so'm)<input
            id="fp"
            type="number"
            min="1000"
            step="500"
            required
        /></label>
        <div class="act" style="margin-top: 14px">
          <button type="submit">Saqlash</button
          ><button type="button" id="cancelm">Bekor</button>
        </div>
      </form>
    </dialog>
    <dialog id="dlgz">
      <form id="zf">
        <h3 id="zt">Yangi hudud</h3>
        <label>Hudud nomi<input id="zn" required maxlength="60" /></label>
        <label
          >Yetkazib berish narxi (so'm)<input
            id="zfee"
            type="number"
            min="0"
            step="500"
            required
        /></label>
        <label style="display: flex; gap: 8px; align-items: center"
          ><input id="zp" type="checkbox" style="width: auto; margin: 0" /> Olib
          ketish (manzil kerak emas)</label
        >
        <div class="act" style="margin-top: 14px">
          <button type="submit">Saqlash</button
          ><button type="button" id="cancelz">Bekor</button>
        </div>
      </form>
    </dialog>
    <dialog id="dlgb">
      <form id="bf">
        <h3>Ko'p hudud qo'shish</h3>
        <p class="muted" style="margin: 4px 0 0">
          Har qatorga bitta hudud: <b>Nomi - narxi</b><br />Masalan:
          <code>Andalib - 15000</code>
        </p>
        <textarea
          id="bt"
          rows="10"
          required
          placeholder="Andalib - 15000&#10;Xonqa markaz - 10000&#10;Uzoq mahalla - 20000"
        ></textarea>
        <div class="act" style="margin-top: 14px">
          <button type="submit">Qo'shish</button
          ><button type="button" id="cancelb">Bekor</button>
        </div>
      </form>

(function () {
  if (window.__autoLoading) return; window.__autoLoading = true;
  const of = window.fetch.bind(window), flight = new Map();
  let active = null;
  const mark = e => { const b = e.target && e.target.closest && e.target.closest("button"); if (b && !b.disabled) active = { btn: b, t: Date.now() }; };
  document.addEventListener("click", mark, true);
  document.addEventListener("submit", e => { const b = e.submitter || (e.target.querySelector && e.target.querySelector('button[type="submit"]')); if (b && !b.disabled) active = { btn: b, t: Date.now() }; }, true);
  document.addEventListener("change", () => { active = null; }, true);
  document.addEventListener("keydown", e => { if (e.key !== "Enter") active = null; }, true);
  function on(b) {
    if (b.getAttribute("aria-busy") === "true" && !b.__n) return false;
    b.__n = (b.__n || 0) + 1;
    if (b.__n === 1) {
      b.__was = b.disabled;
      const s = document.createElement("span"); s.className = "spin"; s.setAttribute("aria-hidden", "true"); s.__auto = 1;
      b.insertBefore(s, b.firstChild); b.disabled = true; b.setAttribute("aria-busy", "true");
    }
    return true;
  }
  function off(b) {
    if (!b.__n || --b.__n) return;
    b.querySelectorAll(":scope > .spin").forEach(s => { if (s.__auto) s.remove(); });
    b.disabled = !!b.__was; b.removeAttribute("aria-busy");
  }
  window.fetch = function (u, o) {
    const m = ((o && o.method) || "GET").toUpperCase();
    if (m === "GET" || m === "HEAD") return of(u, o);
    const body = o && o.body;
    let key = null;
    if (body == null || typeof body === "string") key = m + " " + u + " " + (body || "");
    let btn = null;
    if (active && Date.now() - active.t < 60000 && document.body.contains(active.btn)) btn = active.btn;
    if (key && flight.has(key)) return flight.get(key).then(r => r.clone());
    const shared = of(u, o);
    const on_ = btn ? on(btn) : false;
    if (key) flight.set(key, shared);
    const fin = () => { if (key && flight.get(key) === shared) flight.delete(key); if (on_) off(btn); };
    shared.then(fin, fin);
    return shared.then(r => r.clone());
  };

            await post(`/api/waiters/${id}/status`, "POST", { status: st });
            toast("Saqlandi");
            return load();
          }
          if (t.dataset.eye) {
            const id = +t.dataset.eye;
            pwShown.has(id) ? pwShown.delete(id) : pwShown.add(id);
            return zalTab();
          }
          if (t.dataset.wpw) {
            const v = prompt(
              "Yangi parolni yozing (kamida 6 ta belgi).\nBo'sh qoldirsangiz, tasodifiy parol yaratiladi:",
              "",
            );
            if (v === null) return;
            if (v.trim() && v.trim().length < 6) {
              toast("Parol kamida 6 ta belgi bo'lsin");
              return;
            }
            await post(`/api/waiters/${t.dataset.wpw}/password`, "POST", {
              password: v.trim(),
            });
            pwShown.add(+t.dataset.wpw);
            toast("Parol o'zgartirildi");
            return load();
          }
          if (t.dataset.wdel) {
            if (confirm("Ofitsantni o'chirasizmi?")) {
              await post("/api/waiters/" + t.dataset.wdel, "DELETE");
              toast("O'chirildi");
              load();
            }
            return;
          }
        } catch (err) {
          toast("Xatolik yuz berdi");
        }
      };
      $("#tf").onsubmit = async (e) => {
        e.preventDefault();
        try {
          await post("/api/tables", "POST", {
            zal: $("#tz").value.trim(),
            from: +$("#ta").value,
            to: +$("#tb").value,
            seats: +$("#ts").value,
          });
          $("#dlgt").close();
          toast("Stollar qo'shildi");
          load();
        } catch (err) {
          toast("Saqlab bo'lmadi");
        }
      };
      $("#cancelt").onclick = () => $("#dlgt").close();
      async function resizeImg(file) {
        const bmp = await createImageBitmap(file),
          k = Math.min(1, 720 / Math.max(bmp.width, bmp.height));
        const c = document.createElement("canvas");
        c.width = Math.round(bmp.width * k);
        c.height = Math.round(bmp.height * k);
        c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", 0.82);
      }
      $("#imgf").onchange = async (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (!f || !imgTarget) return;
        try {
          await post(`/api/menu/${imgTarget}/image`, "POST", {
            image: await resizeImg(f),
          });
          toast("Rasm saqlandi");
          load();
        } catch (err) {
          toast("Rasmni saqlab bo'lmadi");
        }
      };
      const cpwShown = new Set();
      const cpwCell = (c) =>
        c.password
          ? `<span class="pw">${cpwShown.has(c.id) ? esc(c.password) : "••••••••"}</span> <button class="eye" data-ceye="${c.id}" aria-label="Parolni ko'rsatish yoki yashirish">${cpwShown.has(c.id) ? "🙈" : "👁"}</button>`
          : '<span class="muted">—</span>';
      function couriersTab() {
        $("#couriers").innerHTML =
          `<div class="card"><div class="tablewrap"><table><tr><th>Dastavchik</th><th>Telefon</th><th>Mashina</th><th>Login</th><th>Parol</th><th>Ro'yxatdan o'tgan</th><th>Yetkazgan</th><th>Umumiy summa</th><th>Holat</th><th></th></tr>` +
          (C.map(
            (c) =>
              `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.car_model)}<br><b>${esc(c.car_number)}</b></td><td>${esc(c.login)}</td><td>${cpwCell(c)}</td><td>${ago(c.created)}</td><td><b>${c.delivered}</b> ta</td><td><b>${fmt(c.earned)}</b></td><td><span class="tag ${c.status === "approved" ? "s-done" : c.status === "pending" ? "s-new" : "s-cancelled"}">${WST[c.status]}</span></td><td><div class="act">${c.status !== "approved" ? `<button data-cst="${c.id}:approved">Tasdiqlash</button>` : `<button data-cst="${c.id}:blocked">Bloklash</button>`}<button data-cpw="${c.id}">Parolni o'zgartirish</button><button data-cdel="${c.id}">O'chirish</button></div></td></tr>`,
          ).join("") ||
            '<tr><td colspan="10" class="muted">Dastavchik yo\'q.</td></tr>') +
          `</table></div></div><p class="muted">Dastavchiklar shu manzil orqali kiradi: <b>${esc(location.origin)}/courier</b></p>`;
      }
      $("#couriers").onclick = async (e) => {
        const t = e.target.closest("button");
        if (!t) return;
        try {
          if (t.dataset.ceye) {
            const id = +t.dataset.ceye;
            cpwShown.has(id) ? cpwShown.delete(id) : cpwShown.add(id);
            return couriersTab();
          }
          if (t.dataset.cst) {
            const [id, st] = t.dataset.cst.split(":");
            await post(`/api/couriers/${id}/status`, "POST", { status: st });
            toast("Saqlandi");
            return load();
          }
          if (t.dataset.cpw) {
            const v = prompt(
              "Yangi parolni yozing (kamida 6 ta belgi).\nBo'sh qoldirsangiz, tasodifiy parol yaratiladi:",
              "",
            );
            if (v === null) return;
            if (v.trim() && v.trim().length < 6) {
              toast("Parol kamida 6 ta belgi bo'lsin");
              return;
            }
            await post(`/api/couriers/${t.dataset.cpw}/password`, "POST", {
              password: v.trim(),
            });
            cpwShown.add(+t.dataset.cpw);
            toast("Parol o'zgartirildi");
            return load();
          }
          if (t.dataset.cdel) {
            if (confirm("Dastavchini o'chirasizmi?")) {
              await post("/api/couriers/" + t.dataset.cdel, "DELETE");
              toast("O'chirildi");
              load();
            }
            return;
          }
        } catch (err) {
          toast("Xatolik yuz berdi");
        }
      };
      let shopMode = null;
      const TPL = {
        dam: "Hurmatli mijozlar! Bugun dam olish kuni, buyurtma qabul qilinmaydi. Ertaga soat 18:00 dan ishlaymiz. Tushunganingiz uchun rahmat! 🌭",
        kech: "Hurmatli mijozlar! Bugun ish vaqtimiz kechroq boshlanadi: soat __:__ dan buyurtma qabul qilamiz. Noqulaylik uchun uzr!",
        erta: "Hurmatli mijozlar! Bugun ish vaqtimiz erta tugaydi: soat __:__ dan keyin buyurtma qabul qilinmaydi. Tushunganingiz uchun rahmat!",
        ochiq:
          "Hurmatli mijozlar! Biz ishlayapmiz, buyurtma berishingiz mumkin! 🌭",
      };
      function shopTab() {
        const s = SH.settings,
          st = SH.status;
        if (shopMode === null) shopMode = st.mode;
        const why =
          st.mode === "open"
            ? "Qo'lda majburan ochiq"
            : st.mode === "closed"
              ? "Qo'lda majburan yopiq"
              : st.in_hours
                ? "Ish vaqti ichida"
                : "Ish vaqtidan tashqarida";
        const MODES = [
          ["auto", "Avtomatik (jadval bo'yicha)"],
          ["open", "Hozir ochiq (majburan)"],
          ["closed", "Hozir yopiq (majburan)"],
        ];
        $("#shop").innerHTML =
          `<div class="card" style="margin-bottom:14px"><div class="oh"><b style="font-size:22px">${st.open ? "🟢 Hozir OCHIQ" : "🔴 Hozir YOPIQ"}</b><span class="muted">${esc(why)}${st.until && st.mode !== "auto" ? " · " + esc(st.until.slice(0, 16)) + " gacha" : ""}</span></div>
    <p class="muted" style="margin:0">Mijozlar botdan faqat ochiq vaqtda buyurtma bera oladi. Ish vaqti: <b>${esc(st.hours)}</b> (Toshkent vaqti)</p></div>
  <div class="card" style="margin-bottom:14px"><h3>Ish vaqti</h3>
    <div class="act"><label>Ochilish<br><input type="time" id="so" value="${esc(s.open_time)}"></label><label>Yopilish<br><input type="time" id="sc" value="${esc(s.close_time)}"></label></div>
    <p class="muted">Yopilish vaqti ochilishdan oldin bo'lsa, ish vaqti yarim tundan o'tadi (masalan, 18:00 dan 02:00 gacha).</p>
    <div class="act"><button id="saveHours">Saqlash</button></div></div>
  <div class="card" style="margin-bottom:14px"><h3>Qo'lda boshqarish</h3>
    <div class="chips">${MODES.map(([k, l]) => `<button data-mode="${k}" class="${shopMode === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div class="shopform" ${shopMode === "auto" ? "hidden" : ""}>
      <label>Qachongacha (ixtiyoriy, shu vaqtdan keyin jadvalga qaytadi)<br><input type="datetime-local" id="suntil" value="${esc((s.until || "").slice(0, 16).replace(" ", "T"))}"></label>
      <label>Mijozlarga ko'rsatiladigan izoh (yopiq bo'lganda)<br><textarea id="snote" rows="2" maxlength="300" placeholder="Masalan: Bugun dam olish kuni. Ertaga 18:00 dan ishlaymiz.">${esc(s.note)}</textarea></label></div>
    <div class="act" style="margin-top:10px"><button id="saveMode">Saqlash</button></div></div>
  <div class="card" style="margin-bottom:14px"><h3>Operator telefon raqami</h3>
    <p class="muted" style="margin:0 0 8px">Buyurtma bekor qilinganda mijozga «Operator bilan bog'laning» xabari bilan shu raqam yuboriladi. Bo'sh qoldirsangiz, raqam yuborilmaydi.</p>
    <input type="tel" id="sphone" inputmode="numeric" autocomplete="off" value="${esc(s.operator_phone ? s.operator_phone.replace(/^\+998/, "+998 ") : "+998 ")}" placeholder="+998 90 123 45 67">
    <div class="act" style="margin-top:10px"><button id="savePhone">Saqlash</button></div></div>
  <div class="card" style="margin-bottom:14px"><h3>🎁 Bonus</h3>
    <p class="muted" style="margin:0 0 8px">Buyurtma (zalda stol bo'yicha jami) shu summaga yetsa, mijoz ro'yxatdan bittasini bepul oladi. Har qatorga bitta nom yozing. Summa 0 bo'lsa yoki ro'yxat bo'sh bo'lsa, bonus o'chiq.</p>
    <label>Minimal summa (so'm)<br><input type="text" id="bmin" inputmode="numeric" autocomplete="off" value="${esc(s.bonus_min && s.bonus_min !== "0" ? s.bonus_min : "")}" placeholder="Masalan: 150000"></label>
    <label>Bonus ro'yxati<br><textarea id="bitems" rows="5" maxlength="600" placeholder="1.5L Cola&#10;Ice Tea&#10;Fuse Tea&#10;Ark Tea">${esc(s.bonus_items || "")}</textarea></label>
    <div class="act" style="margin-top:10px"><button id="saveBonus">Saqlash</button></div></div>
  <div class="card"><h3>Hamma mijozlarga xabar yuborish</h3>
    <p class="muted" style="margin:0 0 8px">Xabar botda ro'yxatdan o'tgan barcha mijozlarga (${U.length} ta) yuboriladi.</p>
    <div class="chips"><button data-tpl="dam">Dam olish</button><button data-tpl="kech">Kech ochiladi</button><button data-tpl="erta">Erta yopiladi</button><button data-tpl="ochiq">Ishlayapmiz</button></div>
    <textarea id="bt" rows="5" maxlength="1500" placeholder="Xabar matnini yozing yoki yuqoridagi namunalardan birini tanlang"></textarea>
    <div class="act" style="margin-top:10px"><button id="sendBc">📣 Hammaga yuborish</button></div></div>`;
      }
      // Operator telefoni: «+998 » o'chmaydi, undan keyin faqat 9 ta raqam yoziladi
      $("#shop").addEventListener("input", (e) => {
        if (e.target.id !== "sphone") return;
        const v =
          "+998 " +
          e.target.value.replace(/\D/g, "").replace(/^998/, "").slice(0, 9);
        if (e.target.value !== v) e.target.value = v;
      });
      $("#shop").onclick = async (e) => {
        const t = e.target.closest("button");
        if (!t) return;
        try {
          if (t.id === "savePhone") {
            const v = $("#sphone").value.replace(/\D/g, "").replace(/^998/, "");
            if (v && v.length !== 9) {
              toast("+998 dan keyin 9 ta raqam yozing");
              return;
            }
            SH = await post("/api/shop", "POST", {
              operator_phone: v ? "+998" + v : "",
            });
            toast(v ? "Operator raqami saqlandi" : "Operator raqami o'chirildi");
            shopTab();
            return load();
          }
          if (t.id === "saveBonus") {
            SH = await post("/api/shop", "POST", {
              bonus_min: $("#bmin").value.replace(/\D/g, "") || "0",
              bonus_items: $("#bitems").value,
            });
            toast("Bonus saqlandi");
            shopTab();
            return load();
          }
          if (t.dataset.mode) {
            shopMode = t.dataset.mode;
            const keep = ($("#bt") || {}).value || "";
            shopTab();
            $("#bt").value = keep;
            return;
          }
          if (t.dataset.tpl) {
            $("#bt").value = TPL[t.dataset.tpl];
            $("#bt").focus();
            return;
          }
          if (t.id === "saveHours") {
            SH = await post("/api/shop", "POST", {
              open_time: $("#so").value,
              close_time: $("#sc").value,
            });
            toast("Ish vaqti saqlandi");
            shopTab();
            return load();
          }
          if (t.id === "saveMode") {
            SH = await post("/api/shop", "POST", {
              mode: shopMode,
              until: shopMode === "auto" ? "" : $("#suntil").value,
              note: shopMode === "auto" ? "" : $("#snote").value,
            });
            shopMode = null;
            toast("Saqlandi");
            shopTab();
            return load();
          }
          if (t.id === "sendBc") {
            const text = $("#bt").value.trim();
            if (text.length < 5) {
              toast("Xabar matnini yozing");
              return;
            }
            if (/__:__/.test(text)) {
              toast("Xabardagi __:__ o'rniga vaqtni yozing");
              return;
            }
            if (
              !confirm(
                `Quyidagi xabar ${U.length} ta mijozga yuboriladi:\n\n${text}\n\nDavom etasizmi?`,
              )
            )
              return;
            const r = await post("/api/broadcast", "POST", { text });
            $("#bt").value = "";
            toast(`Xabar ${r.sent} ta mijozga yuborilmoqda`);
            return;
          }
        } catch (err) {
          toast("Xatolik yuz berdi");
        }
      };
      function menuTab() {
        const cats = [...new Set(M.map((m) => m.cat))];
        $("#menu").innerHTML =
          `<div class="chips"><button id="addm" class="on">+ Yangi mahsulot</button></div>` +
          (cats
            .map(
              (c) =>
                `<div class="card order"><h3>${esc(c)}</h3>` +
                M.filter((m) => m.cat === c)
                  .map(
                    (m) =>
                      `<div class="mrow${m.sold ? " sold" : ""}"><div class="mn">${m.img ? `<img class="th" alt="" src="/img/${m.id}?v=${m.img}">` : ""}<b>${esc(m.name)}</b>${m.desc ? ` <span class="muted">${esc(m.desc)}</span>` : ""}</div><div class="mp">${fmt(m.price)}</div><div class="act"><button data-img="${m.id}">📷 Rasm</button>${m.img ? `<button data-imgdel="${m.id}">Rasmni o'chirish</button>` : ""}<button data-edit="${m.id}">Tahrirlash</button><button data-sold="${m.id}">${m.sold ? "Qayta bor" : "Tugadi"}</button><button data-del="${m.id}">O'chirish</button></div></div>`,
                  )
                  .join("") +
                `</div>`,
            )
            .join("") || '<p class="muted">Menyu bo\'sh.</p>');
      }
      function openM(m) {
        editId = m ? m.id : null;
        $("#dt").textContent = m ? "Mahsulotni tahrirlash" : "Yangi mahsulot";
        $("#fc").value = m ? m.cat : "";
        $("#fn").value = m ? m.name : "";
        $("#fd").value = m ? m.desc : "";
        $("#fp").value = m ? m.price : "";
        $("#dc").innerHTML = [...new Set(M.map((x) => x.cat))]
          .map((c) => `<option value="${esc(c)}">`)
          .join("");
        $("#dlg").showModal();
      }
      $("#menu").onclick = async (e) => {
        const t = e.target.closest("button");
        if (!t) return;
        try {
          if (t.id === "addm") return openM();
          if (t.dataset.img) {
            imgTarget = t.dataset.img;
            return $("#imgf").click();
          }
          if (t.dataset.imgdel) {
            await post("/api/menu/" + t.dataset.imgdel + "/image", "DELETE");
            toast("Rasm o'chirildi");
            return load();
          }
          if (t.dataset.edit)
            return openM(M.find((m) => m.id === t.dataset.edit));
          if (t.dataset.del) {
            if (confirm("Mahsulotni menyudan o'chirasizmi?")) {
              await post("/api/menu/" + t.dataset.del, "DELETE");
              toast("O'chirildi");
              load();
            }
            return;
          }
          if (t.dataset.sold) {
            const m = M.find((x) => x.id === t.dataset.sold),
              ns = !m.sold;
            const notify = confirm(
              (ns
                ? "Mijozlarga botda «tugadi» deb xabar yuborilsinmi?"
                : "Mijozlarga «yana bor» deb xabar yuborilsinmi?") +
                "\n\nOK — yuborish, Bekor — xabarsiz saqlash",
            );
            const r = await post(`/api/menu/${m.id}/sold`, "POST", {
              sold: ns,
              notify,
            });
            toast(
              notify ? `Xabar ${r.sent} ta mijozga yuborilmoqda` : "Saqlandi",
            );
            load();
          }
        } catch (err) {
          toast("Xatolik yuz berdi");
        }
      };
      $("#mf").onsubmit = async (e) => {
        e.preventDefault();
        const b = {
          cat: $("#fc").value.trim(),
          name: $("#fn").value.trim(),
          desc: $("#fd").value.trim(),
          price: +$("#fp").value,
        };
        try {
          await post(
            editId ? "/api/menu/" + editId : "/api/menu",
            editId ? "PUT" : "POST",
            b,
          );
          $("#dlg").close();
          toast("Menyu yangilandi");
          load();
        } catch (err) {
          toast("Saqlab bo'lmadi");
        }
      };
      $("#cancelm").onclick = () => $("#dlg").close();
      // ---- yon menyu ----
      const wide = () => matchMedia("(min-width:900px)").matches;
      function setSide(open, save) {
        document.body.classList.toggle("side-open", open);
        $("#burger").setAttribute("aria-expanded", open);
        if (save && wide()) {
          try {
            localStorage.setItem("side", open ? "1" : "0");
          } catch (e) {}
        }
      }
      let sideSaved = null;
      try {
        sideSaved = localStorage.getItem("side");
      } catch (e) {}
      setSide(wide() && sideSaved !== "0");
      $("#burger").onclick = () =>
        setSide(!document.body.classList.contains("side-open"), true);
      $("#scrim").onclick = () => setSide(false);
      addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !wide()) setSide(false);
      });
      // ---- mavzu ----
      function applyTheme(t, save) {
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
        else delete document.documentElement.dataset.theme;
        [...$("#theme").children].forEach((b) =>
          b.classList.toggle("on", b.dataset.th === (t || "auto")),
        );
        if (save) {
          try {
            localStorage.setItem("theme", t);
          } catch (e) {}
        }
      }
      let savedTheme = "auto";
      try {
        savedTheme = localStorage.getItem("theme") || "auto";
      } catch (e) {}
      applyTheme(savedTheme);
      $("#theme").onclick = (e) => {
        const b = e.target.closest("button");
        if (b) applyTheme(b.dataset.th, true);
      };
      // ---- kirish / chiqish ----
      // So'rov ketayotganda tugmani o'chirib, aylanuvchi belgi ko'rsatadi; qaytarilgan funksiya tugmani tiklaydi
      function busy(e, label) {
        const b = e.submitter || e.target.querySelector('button[type="submit"]');
        if (!b) return () => {};
        const html = b.innerHTML;
        b.disabled = true;
        b.setAttribute("aria-busy", "true");
        b.innerHTML = `<span class="spin" aria-hidden="true"></span>${label}`;
        return () => {
          b.disabled = false;
          b.removeAttribute("aria-busy");
          b.innerHTML = html;
        };
      }
      $("#lf").onsubmit = async (e) => {
        e.preventDefault();
        $("#lerr").textContent = "";
        const done = busy(e, "Kirilmoqda…");
        try {
          const r = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: $("#lp").value }),
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) {
            $("#lerr").textContent = d.error || "Xatolik yuz berdi.";
            return;
          }
          $("#login").hidden = true;
          authed = true;
          setTab(tabFromPath(), "replace");
        } catch (err) {
          $("#lerr").textContent = "Server bilan aloqa yo'q.";
        } finally {
          done();
        }
      };
      $("#logout").onclick = async () => {
        try {
          await fetch("/api/admin/logout", {
            method: "POST",
            headers: { "X-Admin": "1" },
          });
        } catch (e) {}
        showLogin();
      };
      // Kirmagan bo'lsa, boshqa so'rovlar yuborilmaydi (konsolda 401 xatolari chiqmaydi)
      (async () => {
        try {
          const d = await (await fetch("/api/admin/session")).json();
          if (!d.ok) return showLogin();
        } catch (e) {}
        setTab(tabFromPath(), "replace");
      })();
      setInterval(() => {
        if (!document.hidden) load();
      }, 15000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) load();
      });
    </script>
  </body>
