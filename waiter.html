<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>O'rinboy Zal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fff1c2;
        --card: #fffdf6;
        --ink: #3a1c0d;
        --mute: #85685a;
        --red: #d62f1f;
        --mustard: #f2b705;
        --green: #2f9e5b;
        --sh: #3a1c0d;
        --line: #e3c97a;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f130c;
          --card: #34211a;
          --ink: #fff1d6;
          --mute: #c4a88e;
          --sh: #0d0704;
          --line: #5a3a2b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          500 16px/1.4 "Bricolage Grotesque",
          system-ui,
          sans-serif;
        padding-bottom: 110px;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 0 14px;
      }
      [hidden] {
        display: none !important;
      }
      h1 {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 6px 0 2px;
        text-align: center;
      }
      .sub {
        color: var(--mute);
        text-align: center;
        margin: 0 0 14px;
      }
      .logo {
        display: block;
        width: 120px;
        margin: 16px auto 6px;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 24px;
        padding: 4px;
        box-shadow: 4px 4px 0 var(--sh);
      }
      .card {
        background: var(--card);
        border: 2px solid var(--ink);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 4px 4px 0 var(--sh);
      }
      label {
        display: block;
        font-weight: 700;
        margin: 12px 0 5px;
      }
      input,
      textarea {
        width: 100%;
        background: var(--card);
        border: 2px solid var(--ink);
        border-radius: 12px;
        padding: 12px;
      }
      input:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--mustard);
        outline-offset: 2px;
      }
      .btn {
        display: block;
        width: 100%;
        background: var(--mustard);
        color: #3a1c0d;
        border: 2px solid #3a1c0d;
        border-radius: 12px;
        font-weight: 800;
        font-size: 17px;
        padding: 14px;
        margin-top: 16px;
        cursor: pointer;
        box-shadow: 3px 3px 0 #3a1c0d;
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 #3a1c0d;
      }
      .btn.red {
        background: var(--red);
        color: #fff;
      }
      .btn.ghost {
        background: var(--card);
        color: var(--ink);
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 6px;
      }
      .tabs button {
        flex: 1;
        border: 2px solid var(--ink);
        background: var(--card);
        border-radius: 99px;
        padding: 9px;
        font-weight: 700;
        cursor: pointer;
      }
      .tabs button.on {
        background: var(--mustard);
        color: #3a1c0d;
      }
      .msg {
        min-height: 22px;
        margin: 10px 0 0;
        font-weight: 700;
      }
      .msg.err {
        color: var(--red);
      }
      .msg.ok {
        color: var(--green);
      }
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--red);
        color: #fff;
        border: 2px solid var(--ink);
        border-radius: 16px;
        padding: 10px 14px;
        margin: 10px 0;
        box-shadow: 3px 3px 0 var(--sh);
      }
      .top b {
        flex: 1;
        font-size: 18px;
      }
      .top button {
        background: var(--card);
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 10px;
        padding: 6px 12px;
        font-weight: 700;
        cursor: pointer;
      }
      h2.zal {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 18px 0 10px;
        color: var(--red);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .tb {
        aspect-ratio: 1;
        border: 2px solid var(--ink);
        border-radius: 18px;
        background: var(--card);
        box-shadow: 3px 3px 0 var(--sh);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        cursor: pointer;
        animation: pop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      .tb .n {
        font-size: 34px;
        font-weight: 800;
        line-height: 1;
      }
      .tb small {
        font-weight: 700;
        font-size: 12px;
      }
      .tb.free {
        border-color: var(--green);
      }
      .tb.free small {
        color: var(--green);
      }
      .tb.busy {
        background: color-mix(in srgb, var(--red) 18%, var(--card));
        border-color: var(--red);
      }
      .tb.busy small {
        color: var(--red);
      }
      @keyframes pop {
        from {
          transform: scale(0.7);
          opacity: 0;
        }
      }
      .legend {
        color: var(--mute);
        text-align: center;
        margin-top: 16px;
      }
      .chips {
        position: sticky;
        top: calc(env(safe-area-inset-top, 0px) + 64px);
        z-index: 9;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 8px 2px;
        background: var(--bg);
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chips button {
        flex: none;
        border: 2px solid var(--ink);
        background: var(--card);
        border-radius: 99px;
        padding: 6px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .chips button.on {
        background: var(--mustard);
        color: #3a1c0d;
      }
      h2.cat {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 18px 0 10px;
        scroll-margin-top: 130px;
      }
      .mg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .it {
        background: var(--card);
        border: 2px solid var(--ink);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 3px 3px 0 var(--sh);
        display: flex;
        flex-direction: column;
        animation: up 0.5s ease both;
      }
      .it.on {
        border-color: var(--red);
      }
      .it.sold {
        opacity: 0.55;
      }
      @keyframes up {
        from {
          transform: translateY(14px);
          opacity: 0;
        }
      }
      .it .ph {
        aspect-ratio: 4/3;
        background: #f3e2a5;
        overflow: hidden;
      }
      .it .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .it .in {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }
      .it b {
        font-size: 15px;
        line-height: 1.2;
      }
      .it small {
        color: var(--mute);
        font-size: 12px;
      }
      .it .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: auto;
        padding-top: 6px;
      }
      .pr {
        font-weight: 800;
        font-size: 14px;
      }
      .st {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .st button {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid var(--ink);
        background: var(--card);
        font-weight: 800;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
      }
      .st .plus {
        background: var(--red);
        color: #fff;
      }
      .st button:disabled {
        opacity: 0.35;
      }
      .st .q {
        min-width: 16px;
        text-align: center;
        font-weight: 800;
      }
      .soldtag {
        font-weight: 800;
        font-size: 13px;
        border: 2px solid var(--ink);
        border-radius: 99px;
        padding: 0 8px;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        background: var(--red);
        color: #fff;
        border-top: 3px solid var(--ink);
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
        transform: translateY(110%);
        transition: transform 0.4s cubic-bezier(0.2, 1.3, 0.4, 1);
      }
      .bar.show {
        transform: none;
      }
      .bar div {
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-weight: 800;
        font-size: 18px;
      }
      .bar button {
        background: var(--mustard);
        color: #3a1c0d;
        border: 2px solid #3a1c0d;
        border-radius: 12px;
        font-weight: 800;
        font-size: 16px;
        padding: 12px 16px;
        cursor: pointer;
      }
      dialog {
        width: min(480px, 94vw);
        border: 2px solid var(--ink);
        border-radius: 18px;
        background: var(--card);
        color: var(--ink);
        padding: 18px;
        box-shadow: 5px 5px 0 var(--sh);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      dialog h3 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      .row2 {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 0;
        border-bottom: 2px dashed var(--line);
      }
      #toast {
        position: fixed;
        left: 50%;
        top: 14px;
        transform: translate(-50%, -140px);
        z-index: 50;
        background: var(--ink);
        color: var(--bg);
        padding: 11px 18px;
        border-radius: 12px;
        font-weight: 700;
        max-width: 92vw;
        transition: transform 0.35s cubic-bezier(0.2, 1.3, 0.4, 1);
      }
      #toast.show {
        transform: translate(-50%, 0);
      }
    </style>
  </head>

          <form id="fr" hidden>
            <label for="r1">Ism va familiya</label
            ><input id="r1" autocomplete="name" required />
            <label for="r2">Telefon raqami</label
            ><input
              id="r2"
              type="tel"
              inputmode="tel"
              placeholder="+998 90 123 45 67"
              required
            />
            <label for="r3">Login (kichik lotin harflari)</label
            ><input id="r3" autocapitalize="none" required />
            <label for="r4">Parol (kamida 6 ta belgi)</label
            ><input
              id="r4"
              type="password"
              autocomplete="new-password"
              required
            />
            <button class="btn" type="submit">Ro'yxatdan o'tish</button>
          </form>
          <p class="msg" id="amsg" role="alert"></p>
        </div>
      </section>

      <section id="tables" hidden>
        <div class="top">
          <b id="wname"></b><button id="logout">Chiqish</button>
        </div>
        <div id="zals"></div>
        <p class="legend">
          Bo'sh stolni bosing va buyurtma oling.<br />Band stolni bossangiz,
          uning buyurtmasi ko'rinadi.
        </p>
      </section>

      <section id="menu" hidden>
        <div class="top">
          <button id="back">← Stollar</button
          ><b id="mt" style="text-align: right"></b>
        </div>
        <nav class="chips" id="chips"></nav>
        <div id="list"></div>
      </section>
    </main>

    <div class="bar" id="bar">
      <div>
        <span id="sum"></span><button id="review">Ko'rish va yuborish</button>
      </div>
    </div>

    <dialog id="dc">
      <h3>Buyurtmani tekshiring</h3>
      <div id="dcl"></div>
      <label for="note">Izoh (ixtiyoriy)</label
      ><textarea
        id="note"
        rows="2"
        placeholder="Masalan: achchiq sous kam"
      ></textarea>
      <p class="msg err" id="cmsg" role="alert"></p>
      <button class="btn" id="send">Oshxonaga yuborish</button
      ><button class="btn ghost" id="cclose" type="button">Orqaga</button>
    </dialog>

    <dialog id="ds">
      <h3 id="dst"></h3>
      <div id="dsb"></div>
      <button class="btn red" id="free">
        Mijozlar yeb bo'ldi: stolni bo'shatish</button
      ><button class="btn ghost" id="sclose" type="button">Yopish</button>
    </dialog>

    <div id="toast" role="status"></div>

    <script>
      const $ = (s) => document.querySelector(s);
      const fmt = (n) =>
        Number(n || 0)
          .toLocaleString("ru-RU")
          .replace(/\u00a0/g, " ") + " so'm";
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      let token = "";
      try {
        token = localStorage.getItem("wt") || "";
      } catch (e) {}
      let TB = [],
        MENU = [],
        cart = {},
        cur = null,
        poll = null,
        detail = null;

      async function api(u, o = {}) {
        o.headers = {
          "Content-Type": "application/json",
          ...(token ? { Authorization: "Bearer " + token } : {}),
          ...(o.headers || {}),
        };
        const r = await fetch(u, o);
        let d = {};
        try {
          d = await r.json();
        } catch (e) {}
        if (r.status === 401 && token) {
          logout();
          throw new Error("Qayta kiring.");
        }
        if (!r.ok) throw new Error(d.error || "Xatolik yuz berdi.");
        return d;
      }
      function toast(t) {
        const e = $("#toast");
        e.textContent = t;
        e.classList.add("show");
        clearTimeout(toast.t);
        toast.t = setTimeout(() => e.classList.remove("show"), 2800);
      }
      function view(v) {
        ["auth", "tables", "menu"].forEach(
          (x) => ($("#" + x).hidden = x !== v),
        );
        $("#bar").classList.toggle("show", v === "menu" && count() > 0);
        scrollTo(0, 0);
        clearInterval(poll);
        if (v === "tables") poll = setInterval(loadTables, 10000);
      }

      // ---------- kirish / ro'yxatdan o'tish ----------
      document.querySelectorAll(".tabs button").forEach(
        (b) =>
          (b.onclick = () => {
            document
              .querySelectorAll(".tabs button")
              .forEach((x) => x.classList.toggle("on", x === b));
            $("#fl").hidden = b.dataset.m !== "login";
            $("#fr").hidden = b.dataset.m !== "reg";
            $("#amsg").textContent = "";
          }),
      );
      function amsg(t, ok) {
        const e = $("#amsg");
        e.textContent = t;
        e.className = "msg " + (ok ? "ok" : "err");
      }
      $("#fl").onsubmit = async (e) => {
        e.preventDefault();
        try {
          const d = await api("/api/w/login", {
            method: "POST",
            body: JSON.stringify({
              login: $("#l1").value,
              password: $("#l2").value,
            }),
          });
          token = d.token;
          try {
            localStorage.setItem("wt", token);
          } catch (x) {}
          amsg("");
          start();
        } catch (x) {
          amsg(x.message);
        }
      };
      $("#fr").onsubmit = async (e) => {
        e.preventDefault();
        try {
          await api("/api/w/register", {
            method: "POST",
            body: JSON.stringify({
              name: $("#r1").value,
              phone: $("#r2").value,
              login: $("#r3").value,
              password: $("#r4").value,
            }),
          });
          $("#fr").reset();
          document.querySelector('.tabs [data-m="login"]').click();
          amsg(
            "Ro'yxatdan o'tdingiz. Admin tasdiqlagach, login va parol bilan kira olasiz.",
            true,
          );
        } catch (x) {
          amsg(x.message);
        }
      };
      function logout() {
        token = "";
        try {
          localStorage.removeItem("wt");
        } catch (e) {}
        cart = {};
        view("auth");
      }
      $("#logout").onclick = logout;

      // ---------- stollar ----------
      async function loadTables() {
        try {
          const d = await api("/api/w/tables");
          TB = d.tables;
          $("#wname").textContent = "👋 " + d.waiter.name;
          renderTables();
        } catch (e) {}
      }
      function renderTables() {
        const zals = [...new Set(TB.map((t) => t.zal))];
        $("#zals").innerHTML =
          zals
            .map(
              (z) =>
                `<h2 class="zal">${esc(z)}</h2><div class="grid">` +
                TB.filter((t) => t.zal === z)
                  .map(
                    (t, i) =>
                      `<button class="tb ${t.busy ? "busy" : "free"}" data-id="${t.id}" style="animation-delay:${i * 40}ms"><span class="n">${t.number}</span><small>${t.busy ? "Band · " + fmt(t.order.total) : "Bo'sh"}</small></button>`,
                  )
                  .join("") +
                `</div>`,
            )
            .join("") ||
          "<p class=\"legend\">Stollar qo'shilmagan. Admin bilan bog'laning.</p>";
      }
      $("#zals").onclick = (e) => {
        const b = e.target.closest(".tb");
        if (!b) return;
        const t = TB.find((x) => x.id == b.dataset.id);
        if (t.busy) return showBusy(t);
        openMenu(t);
      };
      function showBusy(t) {
        detail = t;
        const o = t.order;
        $("#dst").textContent = `${t.zal} · Stol ${t.number}: band`;
        $("#dsb").innerHTML =
          `<p class="sub" style="text-align:left">Ofitsant: <b>${esc(o.waiter || "—")}</b> · ${esc(o.created.slice(11, 16))}</p>` +
          o.items
            .map(
              (i) =>
                `<div class="row2"><span>${esc(i.name)} × ${i.qty}</span><b>${fmt(i.price * i.qty)}</b></div>`,
            )
            .join("") +
          `<div class="row2" style="font-size:18px"><b>Jami</b><b>${fmt(o.total)}</b></div>` +
          (o.comment
            ? `<p class="sub" style="text-align:left">💬 ${esc(o.comment)}</p>`
            : "");
        $("#ds").showModal();
      }
      $("#sclose").onclick = () => $("#ds").close();
      $("#free").onclick = async () => {
        if (
          !confirm(
            `Stol ${detail.number} bo'shatilsinmi? Mijozlar ketganini tasdiqlang.`,
          )
        )
          return;
        try {
          await api(`/api/w/tables/${detail.id}/free`, { method: "POST" });
          $("#ds").close();
          toast("Stol bo'shatildi");
          loadTables();
        } catch (e) {
          toast(e.message);
        }
      };

      // ---------- menyu ----------
      function hash(s) {
        let h = 0;
        for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
        return h;
      }
      function art(m) {
        const bg = [
          "#ffe9a8",
          "#ffd9b0",
          "#f7c9b9",
          "#d9eab6",
          "#bfe3f2",
          "#e6d3f5",
          "#ffe0c2",
        ][hash(m.cat) % 7];
        const drink = /ichim|cola|fanta|sprite|suv/i.test(m.cat + m.name);
        const body = drink
          ? `<ellipse cx="100" cy="128" rx="40" ry="7" fill="rgba(0,0,0,.14)"/><rect x="78" y="30" width="44" height="96" rx="14" fill="#e0453a" stroke="#3a1c0d" stroke-width="3"/><rect x="88" y="14" width="24" height="20" rx="5" fill="#3a1c0d"/><rect x="78" y="62" width="44" height="30" fill="#fff" opacity=".9"/>`
          : `<ellipse cx="100" cy="124" rx="76" ry="8" fill="rgba(0,0,0,.14)"/><rect x="28" y="74" width="144" height="46" rx="23" fill="#e8b36a" stroke="#3a1c0d" stroke-width="3"/><rect x="14" y="56" width="172" height="32" rx="16" fill="#c8452a" stroke="#3a1c0d" stroke-width="3"/><path d="M30 68q10-12 20 0t20 0t20 0t20 0t20 0t20 0t20 0" stroke="#f2b705" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M30 80h140" stroke="#f0c27d" stroke-width="10" stroke-linecap="round" opacity=".7"/>`;
        return (
          "data:image/svg+xml;utf8," +
          encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150"><rect width="200" height="150" fill="${bg}"/>${body}</svg>`,
          )
        );
      }
      const total = () =>
          MENU.reduce((s, m) => s + (cart[m.id] || 0) * m.price, 0),
        count = () => Object.values(cart).reduce((a, b) => a + b, 0);
      async function openMenu(t) {
        cur = t;
        cart = {};
        try {
          MENU = await api("/api/menu");
        } catch (e) {
          toast(e.message);
          return;
        }
        $("#mt").textContent = `${t.zal} · Stol ${t.number}`;
        const cats = [...new Set(MENU.map((m) => m.cat))];
        $("#chips").innerHTML = cats
          .map((c, i) => `<button data-i="${i}">${esc(c)}</button>`)
          .join("");
        $("#list").innerHTML = cats
          .map(
            (c, i) =>
              `<h2 class="cat" id="c${i}">${esc(c)}</h2><div class="mg">` +
              MENU.filter((m) => m.cat === c)
                .map(
                  (m, k) =>
                    `<article class="it${m.sold ? " sold" : ""}" id="m-${m.id}" style="animation-delay:${k * 50}ms"><div class="ph"><img loading="lazy" alt="" src="${m.img ? `/img/${m.id}?v=${m.img}` : art(m)}" onerror="this.onerror=null;this.src='${art(m).replace(/'/g, "%27")}'"></div>
    <div class="in"><b>${esc(m.name)}</b>${m.desc ? `<small>${esc(m.desc)}</small>` : ""}<div class="row">${m.sold ? '<span class="soldtag">Tugadi</span>' : `<span class="pr">${fmt(m.price)}</span>`}
    <div class="st"><button class="minus" data-id="${m.id}" data-d="-1" hidden aria-label="Kamaytirish">−</button><span class="q" hidden>0</span><button class="plus" data-id="${m.id}" data-d="1" ${m.sold ? "disabled" : ""} aria-label="${esc(m.name)} qo'shish">+</button></div></div></div></article>`,
                )
                .join("") +
              `</div>`,
          )
          .join("");
        view("menu");
        bar();
      }
      $("#chips").onclick = (e) => {
        const b = e.target.closest("button");
        if (b)
          document
            .getElementById("c" + b.dataset.i)
            .scrollIntoView({ behavior: "smooth" });
      };
      $("#list").onclick = (e) => {
        const b = e.target.closest("button");
        if (!b || b.disabled) return;
        const id = b.dataset.id;
        cart[id] = Math.max(0, (cart[id] || 0) + Number(b.dataset.d));
        if (!cart[id]) delete cart[id];
        const n = cart[id] || 0,
          r = document.getElementById("m-" + id);
        r.querySelector(".q").hidden = r.querySelector(".minus").hidden = !n;
        r.querySelector(".q").textContent = n;
        r.classList.toggle("on", !!n);
        bar();
      };
      function bar() {
        $("#bar").classList.toggle("show", count() > 0 && !$("#menu").hidden);
        $("#sum").textContent = `${count()} ta · ${fmt(total())}`;
      }
      $("#back").onclick = () => {
        if (
          count() &&
          !confirm("Tanlangan taomlar o'chib ketadi. Stollarga qaytasizmi?")
        )
          return;
        cart = {};
        view("tables");
        loadTables();
      };

      // ---------- yuborish ----------
      $("#review").onclick = () => {
        $("#dcl").innerHTML =
          MENU.filter((m) => cart[m.id])
            .map(
              (m) =>
                `<div class="row2"><span>${esc(m.name)} × ${cart[m.id]}</span><b>${fmt(m.price * cart[m.id])}</b></div>`,
            )
            .join("") +
          `<div class="row2" style="font-size:19px"><b>Jami</b><b>${fmt(total())}</b></div>`;
        $("#cmsg").textContent = "";
        $("#dc").showModal();
      };
      $("#cclose").onclick = () => $("#dc").close();
      $("#send").onclick = async () => {
        const btn = $("#send");
        btn.disabled = true;
        try {
          await api("/api/w/orders", {
            method: "POST",
            body: JSON.stringify({
              table_id: cur.id,
              comment: $("#note").value.trim(),
              items: Object.entries(cart).map(([id, qty]) => ({ id, qty })),
            }),
          });
          $("#dc").close();
          $("#note").value = "";
          cart = {};
          toast(`✅ Stol ${cur.number} buyurtmasi yuborildi`);
          view("tables");
          loadTables();
        } catch (e) {
          $("#cmsg").textContent = e.message;
          if (/band/i.test(e.message)) {
            setTimeout(() => {
              $("#dc").close();
              cart = {};
              view("tables");
              loadTables();
            }, 1600);
          }
        } finally {
          btn.disabled = false;
        }
      };

      function start() {
        if (!token) {
          view("auth");
          return;
        }
        view("tables");
        loadTables();
      }
      start();
    </script>
  </body>
</html>
