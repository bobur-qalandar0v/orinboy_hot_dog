          <div class="hello t" id="hello"></div>
          <p class="sub t">Tanlang, buyurtma bering. Yetkazib beramiz.</p>
        </div>
        <div class="editbar" id="editbar" hidden></div>
        <div class="closedbar" id="closedbar" hidden></div>
        <nav class="chips" id="chips" aria-label="Bo'limlar"></nav>
        <div id="list"></div>
      </section>

      <section id="checkout" hidden>
        <div class="topsum" aria-live="polite">
          <span id="topl">Umumiy summa</span><b id="topv">0 so'm</b>
        </div>
        <button class="back" id="back">Menyuga qaytish</button>
        <h1>Buyurtmangiz</h1>
        <div id="summary"></div>
        <label for="zq">Hududingiz</label>
        <div class="combo" id="combo">
          <input
            id="zq"
            role="combobox"
            aria-expanded="false"
            aria-controls="zlist"
            aria-autocomplete="list"
            autocomplete="off"
            placeholder="Hududni yozing yoki ro'yxatdan tanlang"
          />
          <button
            type="button"
            id="ztog"
            aria-label="Hududlar ro'yxatini ochish"
          >
            ▾
          </button>
          <ul id="zlist" role="listbox" hidden></ul>
        </div>
        <p class="zinfo" id="zinfo" aria-live="polite"></p>
        <p class="addrinfo" id="addrinfo" hidden></p>
        <label for="note">Izoh (ixtiyoriy)</label>
        <input id="note" placeholder="Masalan: achchiq sous kam bo'lsin" />
        <label id="paylbl">To'lov turi</label>
        <div class="pay" id="pay" role="radiogroup" aria-labelledby="paylbl">
          <button
            type="button"
            class="on"
            data-p="cash"
            role="radio"
            aria-checked="true"
          >
            💵 Naqd
          </button>
          <button type="button" data-p="card" role="radio" aria-checked="false">
            💳 Kartaga o'tkazma
          </button>
        </div>
        <p class="payhint" id="payhint"></p>
        <p class="err" id="err" role="alert"></p>
        <button class="cta" id="send" style="width: 100%; margin-top: 6px">
          Buyurtmani yuborish
        </button>
      </section>

      <section id="done" class="done" hidden>
        <svg viewBox="0 0 52 52" width="92" height="92">
          <circle
            cx="26"
            cy="26"
            r="24"
            fill="var(--mustard)"
            stroke="var(--ink)"
            stroke-width="2.5"
          />
          <path
            id="ck"
            d="M14 27l8 8 16-17"
            fill="none"
            stroke="var(--ink)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-dasharray="60"
          />
        </svg>
        <h2>Buyurtma qabul qilindi</h2>
        <p class="sub">Tez orada operator siz bilan bog'lanadi.</p>
        <button class="cta" id="again">Yangi buyurtma</button>
      </section>
    </main>

    <div class="bar" id="bar">
      <div class="bar-in">
        <div class="sum">
          <span id="cnt">0</span> ta &middot; <span id="total">0 so'm</span>
        </div>
        <button id="go">Savatni ko'rish</button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
